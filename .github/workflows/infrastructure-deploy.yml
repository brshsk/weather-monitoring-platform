name: Deploy Infrastructure

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'infrastructure/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.6.0
    
    - name: Azure Login
      uses: azure/login@v1.4.6
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: OpenTofu Init
      working-directory: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}
      run: tofu init
    
    - name: OpenTofu Validate
      working-directory: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}
      run: tofu validate
    
    - name: OpenTofu Plan
      working-directory: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}
      run: |
        tofu plan -out=tfplan -input=false
        
    - name: Upload Plan
      uses: actions/upload-artifact@v3
      with:
        name: tfplan-${{ github.event.inputs.environment || 'dev' }}
        path: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}/tfplan

  apply:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.6.0
    
    - name: Azure Login
      uses: azure/login@v1.4.6
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Download Plan
      uses: actions/download-artifact@v3
      with:
        name: tfplan-${{ github.event.inputs.environment || 'dev' }}
        path: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}
    
    - name: OpenTofu Init
      working-directory: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}
      run: tofu init
    
    - name: OpenTofu Apply
      working-directory: ./infrastructure/environments/${{ github.event.inputs.environment || 'dev' }}
      run: tofu apply tfplan